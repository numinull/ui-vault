const floatingHeader=$('.site-header');let previousY=window.scrollY,scrollTravel=0,previousDirection=0,scrollPending=false;
function updateHeader(){const y=Math.max(0,window.scrollY),delta=y-previousY;previousY=y;const keyboardFocus=floatingHeader.contains(document.activeElement)&&document.activeElement.matches(':focus-visible');if(y<80||!$('#search-panel').hidden||keyboardFocus||$('#detail').open){floatingHeader.classList.remove('header-hidden');scrollTravel=0;}else if(Math.abs(delta)>1){const direction=Math.sign(delta);scrollTravel=direction===previousDirection?scrollTravel+Math.abs(delta):Math.abs(delta);previousDirection=direction;if(scrollTravel>12){floatingHeader.classList.toggle('header-hidden',direction>0);scrollTravel=0;}}scrollPending=false;}
window.addEventListener('scroll',()=>{if(!scrollPending){scrollPending=true;requestAnimationFrame(updateHeader)}},{passive:true});floatingHeader.addEventListener('focusin',()=>floatingHeader.classList.remove('header-hidden'));window.addEventListener('hashchange',()=>floatingHeader.classList.remove('header-hidden'));

let folderNavigationPending=false;
$('#grid').addEventListener('click',event=>{const folder=event.target.closest('a.folder');if(!folder||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey||event.button!==0)return;if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;event.preventDefault();if(folderNavigationPending)return;folderNavigationPending=true;folder.classList.add('opening');const destination=folder.getAttribute('href');setTimeout(()=>{folderNavigationPending=false;location.hash=destination},130)});
window.addEventListener('hashchange',()=>{const main=document.querySelector('main');main.classList.remove('collection-enter');void main.offsetWidth;main.classList.add('collection-enter');const title=$('#page-title');title.setAttribute('tabindex','-1');title.focus({preventScroll:true})});
</script></body></html>
